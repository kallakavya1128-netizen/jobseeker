<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Government Career Navigator</title>
    <meta name="description" content="Personalized discovery, eligibility evaluation, and preparation platform for Indian government jobs and competitive examinations." />
    <meta property="og:title" content="Government Career Navigator" />
    <meta property="og:description" content="Personalized discovery, eligibility evaluation, and preparation platform for Indian government jobs and competitive examinations." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully silence harmless Vite HMR WebSocket connection warnings/rejections in preview iframe environments
      (function() {
        function isWsError(msg) {
          if (!msg) return false;
          var str = String(msg);
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('websocket') !== -1 ||
                 str.indexOf('closed without opened') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason)) ? (reason.message || reason) : '';
          if (isWsError(msg)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message);
          if (isWsError(msg)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Cabinet+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
    <style>
      :root {
        --chat--color--primary: #4f46e5;
        --chat--color--primary-shade-50: #4338ca;
        --chat--color--primary--shade-100: #3730a3;
        --chat--color--secondary: #059669;
        --chat--window--z-index: 99999;
        --chat--toggle--z-index: 99999;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      try {
        const { createChat } = await import('https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js');
        const origin = window.location.origin || '';
        const webhookUrl = origin ? `${origin}/api/chat` : '/api/chat';
        createChat({
          webhookUrl: webhookUrl,
          webhookConfig: {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
          },
          mode: 'window',
          showWelcomeScreen: false,
          loadPreviousSession: false,
          enableStreaming: false,
          initialMessages: [
            'Hello! 👋 I am your Job Seeker AI Assistant.',
            'Ask me anything about Indian government exams (UPSC, SSC, Banking, Railways, Defense), eligibility rules, exam patterns, or preparation guidance!'
          ],
          i18n: {
            en: {
              title: 'Job Seeker AI',
              subtitle: 'Indian Government Exams Assistant',
              footer: 'AI-Powered Career Navigator',
              getStarted: 'New Conversation',
              inputPlaceholder: 'Ask an exam question...',
            },
          },
        });
      } catch (e) {
        console.warn('n8n chat widget initialization:', e);
      }
    </script>
  </body>
</html>
